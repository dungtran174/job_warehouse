[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "job-warehouse-crawler"
version = "0.1.0"
description = "Safe, resumable Raw/Bronze crawlers for Vietnamese job sources"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "playwright>=1.48,<2",
  "pydantic>=2.8,<3",
  "selectolax>=0.3.21,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
  "respx>=0.21,<1",
  "ruff>=0.6,<1",
]

[project.scripts]
job-crawler = "job_crawler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-m 'not live'"
markers = [
  "live: tests that access a live public website and require explicit authorization",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["job_crawler"]

[[tool.mypy.overrides]]
module = "selectolax.*"
ignore_missing_imports = true
