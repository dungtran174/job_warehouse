[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "job-warehouse-crawler"
version = "0.1.0"
description = "Safe, resumable Raw/Bronze crawlers for Vietnamese job sources"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "playwright>=1.48,<2",
  "pydantic>=2.8,<3",
  "selectolax>=0.3.21,<1",
]

[project.optional-dependencies]
warehouse = [
  "pandas>=2.2,<4",
  "pyarrow>=19,<26",
  "psycopg[binary]>=3.2,<4",
]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
  "respx>=0.21,<1",
  "ruff>=0.6,<1",
]

[project.scripts]
job-crawler = "job_crawler.cli:main"
job-warehouse = "job_warehouse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"job_warehouse.bronze" = ["migrations/*.sql"]
"job_warehouse.silver" = ["mappings/*.csv"]
"job_warehouse.silver.enrichment" = ["mappings/*.csv"]
"job_warehouse.silver.salary" = ["*.csv"]
"job_warehouse.skills" = [
  "mappings/*.csv", "mappings/*.json",
  "mappings_expanded/*.csv", "mappings_expanded/*.json",
  "mappings_sales/*.csv", "mappings_sales/*.json",
  "mappings_real_estate/*.csv", "mappings_real_estate/*.json",
  "mappings_hr_finance/*.csv", "mappings_hr_finance/*.json",
  "mappings_logistics/*.csv", "mappings_logistics/*.json",
]

[tool.pytest.ini_options]
addopts = "-m 'not live'"
markers = [
  "live: tests that access a live public website and require explicit authorization",
  "warehouse_db: offline PostgreSQL tests in an isolated temporary database",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["job_crawler", "job_warehouse"]

[[tool.mypy.overrides]]
module = "selectolax.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pyarrow.*"
ignore_missing_imports = true
